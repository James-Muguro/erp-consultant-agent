# Pytest configuration for ERP Consultant AI Agent

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options.
#
# Coverage flags are intentionally NOT here. They used to live in addopts,
# which meant every `pytest -q tests/` invocation paid the ~30-60% runtime
# cost of line instrumentation even when nobody was reading the coverage
# report. Coverage is now opt-in via the FULL validation command:
#
#     pytest -q --cov=src --cov-report=html --cov-report=term-missing tests/
#
# The permanent `-m "not api"` filter has likewise been removed from
# addopts. It silently deselected the API-marked tests on every run,
# including runs where the caller wanted the full suite. Marker selection
# is now explicit at the call site:
#
#     FAST:  pytest -q -m "not api and not timing" tests/
#     FULL:  pytest -q tests/
addopts =
    -ra
    --strict-markers
    --disable-warnings
    --tb=short

# Markers
# Every marker used on a test must be registered here, because
# --strict-markers makes an unregistered marker a collection error
# rather than a silent no-op.
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    api: Tests that call external APIs
    timing: Timing-sensitive tests that sleep in real wall-clock time; deselect with -m "not timing"

# Logging.
#
# log_cli was previously on at INFO. Every logger.info emitted from
# src/services/project_intelligence.py during a version transition (or
# any other service path) was formatted and written to stdout inline
# with test execution. That is real I/O on the hot path of the versioning
# suite and it is not needed for a normal run.
#
# Default is off. To watch live log output for a specific run, pass
# --log-cli-level=INFO on the command line; the CLI flag enables the
# CLI log handler even when log_cli is false in this file.
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: