# Pytest configuration for ERP Consultant AI Agent

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options
addopts =
    -ra
    --strict-markers
    --disable-warnings
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    -m "not api"

# Markers
# Every marker used on a test must be registered here, because
# --strict-markers makes an unregistered marker a collection error
# rather than a silent no-op.
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    api: Tests that call external APIs
    timing: Timing-sensitive tests that sleep in real wall-clock time; deselect with -m "not timing"

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: