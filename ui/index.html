<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERP Consultant Agent</title>
    <link rel="stylesheet" href="/ui/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>ERP Consultant Agent</h1>
      <div id="session-banner" class="session-banner">No active project - just tell me what you'd like to start.</div>
      <div id="chat" class="chat-box"></div>
      <div class="chat-input">
        <input id="msg" type="text" placeholder="e.g. 'Start a project for Contoso Manufacturing' or ask any question..." />
        <button id="send">Send</button>
      </div>
    </div>
    <script src="/ui/app.js"></script>
  </body>
</html>
