<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERP Consultant Agent - Demo UI</title>
    <link rel="stylesheet" href="/ui/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>ERP Consultant Agent</h1>
      <div class="app">
        <div class="left">
          <h2>Chat</h2>
          <div id="chat" class="chat-box"></div>
          <div class="chat-input">
            <input id="msg" type="text" placeholder="Ask a question or trigger a workflow..." />
            <button id="send">Send</button>
          </div>
        </div>
        <div class="right">
          <h2>Project</h2>
          <form id="project-form">
            <label>Project name: <input name="project_name" value="Demo Project" /></label>
            <label>Module: <input name="module" value="FI" /></label>
            <button type="submit">Start Project</button>
          </form>
          <div id="project-status"></div>
        </div>
      </div>
    </div>
    <script src="/ui/app.js"></script>
  </body>
</html>
