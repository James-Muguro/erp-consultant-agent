<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Consultant Agent</title>
    <link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ERP Consultant Agent</h1>
        </div>
        <div class="chat-window">
            <div id="conversation" class="conversation-container">
                {% for message in conversation %}
                    <div class="message {{ message.role }}">
                        <div class="bubble">
                            <strong>{{ message.role.capitalize() }}:</strong>
                            <p>{{ message.content }}</p>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
        <div class="input-area">
            <form action="/prompt" method="post">
                <input type="text" id="user_prompt" name="user_prompt" placeholder="Enter your prompt here..." autofocus>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
    <script>
        // Auto-scroll to the latest message
        window.onload = function() {
            var conversationContainer = document.getElementById("conversation");
            if (conversationContainer) {
                conversationContainer.scrollTop = conversationContainer.scrollHeight;
            }
        };
    </script>
</body>
</html>
