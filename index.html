<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERP Consultant Agent</title>

    <link rel="stylesheet" href="/ui/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
</head>

<body>
    <div class="container">

        <div class="header">
            <h1>ERP Consultant Agent</h1>
        </div>

        <div id="session-banner" class="session-banner">
            No active project yet - describe what you'd like to work on.
        </div>

        <div class="chat-window">
            <div id="conversation" class="conversation-container">
                {% for message in conversation %}
                    <div class="message {{ message.role }}">
                        <div class="bubble">
                            <strong>{{ message.role.capitalize() }}:</strong>
                            <div class="message-content">
                                {{ message.content }}
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>

        <div class="input-area">
            <div class="chat-input">
                <input
                    type="text"
                    id="msg"
                    name="user_prompt"
                    placeholder="Ask a question, or describe what you need (e.g. a new implementation, requirements, test cases)..."
                    autofocus
                >

                <button type="button" id="send">
                    Send
                </button>
            </div>
        </div>

    </div>

    <script src="/ui/app.js"></script>

    <script>
        // Auto-scroll to the latest message when the page loads
        window.onload = function () {
            var conversationContainer =
                document.getElementById("conversation");

            if (conversationContainer) {
                conversationContainer.scrollTop =
                    conversationContainer.scrollHeight;
            }
        };
    </script>
</body>
</html>
